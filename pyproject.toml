[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yt-cli-player"
version = "1.1.0"
description = "A terminal player for YouTube channels, YouTube presets, and internet radio."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["youtube", "internet-radio", "mpv", "yt-dlp", "fzf", "tui"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pyright>=1.1.393",
    "ruff>=0.6",
]

[project.scripts]
yt-cli = "yt_cli:cli"

[project.urls]
Homepage = "https://github.com/Onehand-Coding/yt-cli"
Repository = "https://github.com/Onehand-Coding/yt-cli"
Issues = "https://github.com/Onehand-Coding/yt-cli/issues"

[tool.hatch.build.targets.wheel]
only-include = ["yt_cli.py"]

# The checkout's tests/e2e/bin has absolute symlinks (curl, mpv), which uv refuses
# to unpack from an sdist. Ship only what the installed tool needs.
[tool.hatch.build.targets.sdist]
only-include = ["yt_cli.py", "yt-cli", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
norecursedirs = ["tests/e2e", "docs", "e2e"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tests/e2e", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
