[settings]
# Default video player
player = mpv

# Show video window by default (true/false)
video = false

# Loop playlist by default (true/false)
loop = false

# Run in background by default (true/false)
background = false

# ─── PRESETS ──────────────────────────────────────────────────────────────────
# Each preset has:
#   name     = Display name
#   url      = YouTube or stream URL
#   category = Group in TUI menu
#   loop     = true/false (overrides global default)
#   video    = true/false (overrides global default)
#   radio    = true/false (seed YouTube radio mix from URL)
#   enabled  = true/false

[preset.my-radio]
name = My Radio
url = https://music.youtube.com/watch?v=-B2yzG6Gj0A&list=RDATg6X
category = Radio
radio = true
loop = false
enabled = true

